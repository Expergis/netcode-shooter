[workspace]
resolver = "2"
members = [
    "netcode-core",
    "game-common",
    "game-server",
    "game-client",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["netcode-shooter contributors"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/example/netcode-shooter"

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
# Async runtime
tokio       = { version = "1.38", features = ["full"] }

# Serialization
serde       = { version = "1.0", features = ["derive"] }
bincode     = "1.3"

# Math
glam        = { version = "0.27", features = ["serde"] }

# Rendering (client only)
macroquad   = "0.4"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow             = "1"

# Internal crates
netcode-core = { path = "netcode-core" }
game-common  = { path = "game-common" }
